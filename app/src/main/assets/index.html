function errMsg(x){var c=(x&&x.code)||'',m={'auth/invalid-email':L('ইমেইল ঠিক নয়।','Invalid email.'),'auth/invalid-credential':L('ইমেইল বা পাসওয়ার্ড ভুল।','Wrong email or password.'),'auth/wrong-password':L('পাসওয়ার্ড ভুল।','Wrong password.'),'auth/user-not-found':L('এই ইমেইলে অ্যাকাউন্ট নেই।','No account with this email.'),'auth/email-already-in-use':L('এই ইমেইলে অ্যাকাউন্ট আছে, সাইন ইন করুন।','Account already exists, please sign in.'),'auth/weak-password':L('পাসওয়ার্ড আরও বড় দিন।','Password is too weak.'),'auth/network-request-failed':L('ইন্টারনেট নেই।','No internet connection.'),'auth/too-many-requests':L('অনেকবার চেষ্টা হয়েছে, একটু পরে চেষ্টা করুন।','Too many attempts, try again later.')};return m[c]||(L('সমস্যা হয়েছে: ','Error: ')+c)}
function authEmail(isNew){var e=$('aem').value.trim(),p=$('apw').value;if(!e||p.length<6){amsg(L('ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।','Enter an email and a password of 6+ characters.'));return}
 amsg('…');(isNew?fb.auth.createUserWithEmailAndPassword(e,p):fb.auth.signInWithEmailAndPassword(e,p)).catch(function(x){amsg(errMsg(x))})}
function authGoogle(){if(window.Android&&Android.googleSignIn){amsg('…');Android.googleSignIn()}else fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(x){amsg(errMsg(x))})}
function onGoogleToken(t){if(!t){amsg(L('Google সাইন ইন ব্যর্থ হয়েছে।','Google sign-in failed.'));return}fb.auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(t)).catch(function(x){amsg(errMsg(x))})}
function onGoogleError(c){amsg(L('Google সাইন ইন ব্যর্থ (কোড ','Google sign-in failed (code ')+c+')')}
function authReset(){var e=$('aem').value.trim();if(!e){amsg(L('আগে ইমেইল লিখুন।','Enter your email first.'));return}fb.auth.sendPasswordResetEmail(e).then(function(){amsg(L('রিসেট লিংক ইমেইলে পাঠানো হয়েছে।','Reset link sent to your email.'))}).catch(function(x){amsg(errMsg(x))})}
function acctRender(){var el=$('acct');if(!el)return;var h2;
 if(!fb.ready)h2='<p class="note" style="margin:0">'+L('ক্লাউড সিঙ্ক এই সংস্করণে চালু নেই।','Cloud sync is not enabled in this build.')+'</p>';
 else if(!fb.user)h2='<p class="note" style="margin:0 0 12px">'+L('লগইন করলে অ্যালার্ম ও ইতিহাস সব ফোনে সিঙ্ক হবে।','Sign in to sync alarms and history across phones.')+'</p><button class="add" id="aopen">'+L('সাইন ইন / সাইন আপ','Sign in / Sign up')+'</button>';
 else h2='<div style="font-weight:600;word-break:break-all">'+esc(fb.user.email||'')+'</div><p class="note" style="margin:4px 0 12px">'+esc(syncSt)+'</p><button class="gbtn" id="async">'+L('এখনই সিঙ্ক করুন','Sync now')+'</button><button class="gbtn" id="aout" style="margin-top:8px">'+L('সাইন আউট','Sign out')+'</button><p class="note" style="margin:8px 0 0">'+L('সাইন আউট করলে এই ফোন থেকে অ্যালার্ম মুছে যাবে, ক্লাউডে থেকে যাবে।','Signing out clears alarms on this phone; they stay in the cloud.')+'</p>';
 el.innerHTML=h2;
 if($('aopen'))$('aopen').onclick=openAuth;
 if($('async'))$('async').onclick=function(){pushSync();pullSync()};
 if($('aout'))$('aout').onclick=function(){fb.auth.signOut().then(function(){applying=true;list=[];hist=[];sv(KEY,list);sv(KH,hist);try{localStorage.removeItem('ghonti-upd')}catch(e){}applying=false;render();renderHist();upNext()})}}
var TK="ghonti-theme2";
function setTheme(t){var r=document.documentElement;r.setAttribute("data-mode",t);sv(TK,t);setColor(curC);setTimeout(barSync,50);Array.prototype.forEach.call(document.querySelectorAll(".ts button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-t")===t)})}
Array.prototype.forEach.call(document.querySelectorAll(".ts"),function(box){[["auto","অটো"],["light","লাইট"],["dark","ডার্ক"]].forEach(function(o){var b=document.createElement("button");b.textContent=o[1];b.setAttribute("data-t",o[0]);b.onclick=function(){setTheme(o[0])};box.appendChild(b)})});
setTheme(ld(TK,"light"));
$("rep").onclick=function(){daily=!daily;this.setAttribute("aria-checked",daily)};
$("go").onclick=function(){audio();enter();maybeAuth()};
$("logo").onclick=function(){$("app").classList.add("hide");$("intro").classList.remove("hide")};
$("add").onclick=function(){
  audio();var t=$("time").value,msg=$("msg");
  if(!t){msg.textContent=T('সময় বেছে নিন।');return}
  var p=t.split(":"),r={id:Date.now(),title:$("title").value.trim()||"ঘণ্টি",at:atFor(+p[0],+p[1]),daily:daily,on:true,tone:selTone};
  list.push(r);sv(KEY,list);render();upNext();$("title").value="";
  msg.textContent=T('সেট হয়েছে: ')+dayL(r.at)+" "+fmt(r.at);
  try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}};
$("stop").onclick=function(){setHist(curH,"বন্ধ করা হয়েছে");stopRing()};
$("snooze").onclick=function(){var r=cur;setHist(curH,"স্নুজ করা হয়েছে");stopRing();if(r){list.push({id:Date.now(),title:r.title,at:Date.now()+3e5,daily:false,on:true,tone:r.tone});sv(KEY,list);render();upNext()}};
document.addEventListener("click",audio);
list=ld(KEY,[]);hist=ld(KH,[]);
function nativeFired(){try{if(!window.Android)return;var f=JSON.parse(Android.takeFired()||'[]');if(!f.length)return;f.forEach(function(x){list.forEach(function(r){if(r.id===x.id&&r.on){addHist(r.title,'বেজেছে',x.ts);if(r.daily){var d=new Date(r.at);r.at=nextAt(d.getHours(),d.getMinutes())}else r.on=false}})});sv(KEY,list);render();upNext()}catch(e){}}
function barSync(){try{if(window.Android)Android.setBars(getComputedStyle(document.body).backgroundColor)}catch(e){}}
nativeFired();
var n0=Date.now();list.forEach(function(r){if(r.on&&r.at<n0-90000){addHist(r.title,"মিস হয়েছে",r.at);if(r.daily){var x=new Date(r.at);r.at=nextAt(x.getHours(),x.getMinutes())}else r.on=false}});
sv(KEY,list);render();renderHist();tick();setInterval(tick,1000);
fbInit();applyLang();if(ld(SEEN,0))enter();
</script>
